name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 03:00 WIB (UTC+7) == 20:00 UTC
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ cakraawijaya }}
          SETTING_JSON: Assets/GitHub-Stats/conf/github-profile-3d-contrib.json

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: update 3D contribution graph"
            git push
          fi
